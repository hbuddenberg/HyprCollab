[package]
name = "hyprcollab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HyprCollab workspace-root integration-test harness"

[dev-dependencies]
hyprcollab-core     = { path = "crates/hyprcollab-core" }
hyprcollab-router   = { path = "crates/hyprcollab-router" }
hyprcollab-agent    = { path = "crates/hyprcollab-agent" }
hyprcollab-tools    = { path = "crates/hyprcollab-tools" }
hyprcollab-commands = { path = "crates/hyprcollab-commands" }
hyprcollab-approval = { path = "crates/hyprcollab-approval" }
async-trait         = "0.1"
tokio               = { workspace = true }
futures             = { workspace = true }
serde_json          = { workspace = true }
chrono              = { workspace = true }
uuid                = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/hyprcollab-core",
    "crates/hyprcollab-server",
    "crates/hyprcollab-agent",
    "crates/hyprcollab-memory",
    "crates/hyprcollab-rag",
    "crates/hyprcollab-artifacts",
    "crates/hyprcollab-acp",
    "crates/hyprcollab-skills",
    "crates/hyprcollab-tools",
    "crates/hyprcollab-mcp",
    "crates/hyprcollab-commands",
    "crates/hyprcollab-browser",
    "crates/hyprcollab-approval",
    "crates/hyprcollab-media-preview",
    "crates/hyprcollab-image",
    "crates/hyprcollab-voice",
    "crates/hyprcollab-config",
    "crates/hyprcollab-lua",
    "crates/hyprcollab-ext",
    "crates/hyprcollab-marketplace",
    "crates/hyprcollab-persona",
    "crates/hyprcollab-ui",
    "crates/hyprcollab-provider-openai",
    "crates/hyprcollab-provider-anthropic",
    "crates/hyprcollab-provider-ollama",
    "crates/hyprcollab-provider-openrouter",
    "crates/hyprcollab-provider-native",
    "crates/hyprcollab-router",
    "crates/hyprcollab-canvas",
    "platforms/hyprcollab-tauri",
    "platforms/hyprcollab-tui",
    "platforms/hyprcollab-pwa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hbuddenberg/HyprCollab"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Database
rusqlite = { version = "0.38", features = ["bundled"] }
deadpool-sqlite = { version = "0.13", features = ["rt_tokio_1"] }

# Collections
indexmap = "2"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
hyprcollab-core = { path = "crates/hyprcollab-core" }

# Async traits
async-trait = "0.1"

# TUI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"

# Rendering
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.12"
resvg = "0.44"
tiny-skia = "0.11"

# Media / encoding
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# WebSocket
tokio-tungstenite = { version = "0.24", default-features = false }

# Testing
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
