<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyprCollab v17 — UI Refinements</title>
  <meta name="description" content="HyprCollab terminal frontend mockup displaying UI refinements, Complements section, System Prompt editor, and responsive layouts.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .iconify {
      display: inline-block;
      vertical-align: middle;
    }
    .iconify[data-width="16"] {
      width: 16px;
      height: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; 
      --sidebar: #0d1117; 
      --surface: #161b22; 
      --border: #30363d;
      --text: #e6edf3; 
      --text2: #8b949e; 
      --accent: #58a6ff; 
      --green: #3fb950;
      --red: #f85149; 
      --purple: #bc8cff; 
      --yellow: #d29922;
      --icon-strip: #090c10;
      --sidebar-width: 260px;
      --bubble-font-size: 14px;
    }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    .app { 
      display: grid; 
      grid-template-rows: 48px 1fr; 
      grid-template-columns: 48px var(--sidebar-width) 1fr 320px 48px; 
      height: 100vh; 
      width: 100vw;
      transition: grid-template-columns 0.3s ease;
    }

    /* Icon Strip Panel (VS Code style activity bar) - Left */
    .icon-strip {
      grid-column: 1;
      grid-row: 1 / -1;
      background: var(--icon-strip);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      height: 100%;
      z-index: 10;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .icon-strip::-webkit-scrollbar {
      display: none;
    }
    .icon-strip-top {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .icon-strip-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 20px;
      position: relative;
      transition: all 0.15s;
    }
    .icon-strip-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }
    .icon-strip-btn.active {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.02);
    }
    .icon-strip-btn.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .icon-strip-btn.settings-btn {
      margin-top: auto;
    }

    /* Right Icon Strip (NEW) */
    .right-strip {
      grid-column: 5;
      grid-row: 1 / -1;
      background: var(--icon-strip);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      height: 100%;
      z-index: 10;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .right-strip::-webkit-scrollbar {
      display: none;
    }
    .right-strip-top {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .right-strip-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 20px;
      position: relative;
      transition: all 0.15s;
    }
    .right-strip-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }
    .right-strip-btn.active {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.02);
    }
    .right-strip-btn.active::before {
      content: "";
      position: absolute;
      right: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--accent);
      border-radius: 2px 0 0 2px;
    }
    .right-strip-btn.toggle-btn {
      margin-top: auto;
    }

    /* Top Bar */
    .topbar { 
      grid-column: 3 / 5; 
      grid-row: 1; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 16px; 
      background: var(--sidebar); 
      border-bottom: 1px solid var(--border); 
      height: 48px;
      z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .chat-header-info { display: flex; flex-direction: column; }
    .chat-header-info .name { font-weight: 600; font-size: 14px; color: var(--text); }
    .chat-header-info .meta { font-size: 12px; color: var(--text2); }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-family: inherit; }
    .btn-ghost { background: transparent; color: var(--text2); }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }
    .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }
    .mobile-sidebar-tabs { display: none; }
    .mobile-right-btn { display: none; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text); width: 34px; height: 34px; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
    
    /* Panel actions on tablet/mobile */
    .tablet-mobile-panel-btn {
      display: none;
    }

    /* Complements Dropdown/Popover Popover Styles */
    #complements-popover {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 190px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1000;
      flex-direction: column;
    }

    /* Sidebar */
    .sidebar { 
      grid-column: 2; 
      grid-row: 1 / -1; 
      background: var(--sidebar); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      border-right: 1px solid var(--border); 
      height: 100%;
    }
    .sidebar-brand {
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-header { 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      border-bottom: 1px solid transparent; 
      flex-shrink: 0;
    }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-row input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .search-row input:focus {
      border-color: var(--accent);
    }
    .btn-new-chat {
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      background: var(--accent);
      border: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-new-chat:hover {
      background: #4090ff;
    }
    .project-filter-row {
      margin-top: 8px;
    }
    .project-filter-select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 12px;
      padding-right: 32px;
    }
    .project-filter-select:focus {
      border-color: var(--accent);
    }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .chat-group-label { font-size: 11px; text-transform: uppercase; color: var(--text2); padding: 12px 8px 4px; letter-spacing: 0.5px; font-weight: 600; }
    .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; }
    .chat-item:hover { background: var(--surface); }
    .chat-item.active { background: var(--surface); border: 1px solid rgba(88, 166, 255, 0.2); }
    .chat-item-line1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .chat-item-name { font-size: 13px; font-weight: 500; }
    .chat-item-time { font-size: 11px; color: var(--text2); }
    .chat-item-title { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item-project {
      font-size: 11px;
      color: var(--text2);
      opacity: 0.6;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sidebar-footer { padding: 12px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text2); text-align: center; padding: 24px; }
    .placeholder-icon { font-size: 32px; margin-bottom: 12px; }
    .sidebar-placeholder h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .sidebar-placeholder p { font-size: 13px; }

    /* Chat Area */
    .chat-area { 
      grid-column: 3;
      grid-row: 2;
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .msg { max-width: 80%; display: flex; flex-direction: column; position: relative; padding: 8px 8px 24px 8px; border-radius: 8px; }
    .msg.user { align-self: flex-end; }
    .msg.bot { align-self: flex-start; width: 100%; }
    .msg .bubble { padding: 12px 16px; border-radius: 16px; font-size: var(--bubble-font-size, 14px); line-height: 1.6; position: relative; }
    .msg.user .bubble { background: var(--surface); border-bottom-right-radius: 4px; border: 1px solid var(--border); }
    .msg.bot .bubble { background: transparent; padding-left: 32px; }

    /* Compact Mode styling */
    .messages.compact { gap: 6px; padding: 8px; }
    .messages.compact .msg { padding: 4px 4px 16px 4px; }
    .messages.compact .msg .bubble { padding: 8px 12px; line-height: 1.4; }
    .messages.compact .avatar { width: 24px; height: 24px; font-size: 11px; }

    /* Toggles styling */
    .setting-toggle-btn {
      width: 38px;
      height: 20px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
      padding: 0;
      display: inline-block;
      vertical-align: middle;
    }
    .setting-toggle-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .setting-toggle-btn span {
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 2px;
      transition: left 0.2s;
      left: 2px;
    }
    .setting-toggle-btn.active span {
      left: 20px;
    }
    .msg.bot .sender { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .msg.bot .sender-name { font-size: 13px; font-weight: 600; }
    .msg.bot .sender-time { font-size: 11px; color: var(--text2); }
    .msg.user .msg-time { text-align: right; font-size: 11px; color: var(--text2); margin-top: 4px; padding-right: 4px; }
    
    /* Code block customizations */
    .code-block { background: #111; border-radius: 8px; margin: 8px 0; overflow: hidden; border: 1px solid var(--border); }
    .code-block-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--surface); font-size: 12px; color: var(--text2); }
    .code-block pre { padding: 12px; font-family: JetBrains Mono, monospace; font-size: 13px; overflow-x: auto; line-height: 1.5; }
    
    .tool-call { background: var(--surface); border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 13px; cursor: pointer; border: 1px solid var(--border); }
    .tool-call-header { display: flex; align-items: center; gap: 8px; }
    .tool-call-status { color: var(--green); font-size: 12px; }
    .tool-call-output { margin-top: 8px; font-family: JetBrains Mono, monospace; font-size: 12px; color: var(--text2); display: none; }
    .tool-call.open .tool-call-output { display: block; }

    /* Message Hover Actions Styling */
    .msg-hover-actions {
      position: absolute;
      bottom: 2px;
      display: flex;
      gap: 2px;
      padding: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-in-out;
      z-index: 15;
    }
    .msg.bot .msg-hover-actions {
      left: 36px;
    }
    .msg.user .msg-hover-actions {
      right: 4px;
    }
    .msg:hover .msg-hover-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .msg-hover-btn {
      background: transparent;
      border: none;
      color: var(--text2);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }
    .msg-hover-btn:hover {
      background: #1a1a1a;
      color: var(--text);
    }

    /* Message Sibling Switching */
    .sibling-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text2);
      margin-top: 6px;
      margin-left: 32px;
    }
    .sibling-btn {
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      transition: background 0.1s, color 0.1s;
    }
    .sibling-btn:hover {
      background: var(--surface);
      color: var(--text);
    }
    .sibling-indicator {
      font-family: JetBrains Mono, monospace;
    }

    /* Audio TTS Waveform player */
    .tts-player {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 320px;
      margin-left: 32px;
    }
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      height: 24px;
    }
    .waveform .bar {
      width: 3px;
      background: var(--border);
      border-radius: 2px;
      transition: background-color 0.2s;
    }
    .waveform .bar.anim {
      background: var(--accent);
      animation: wave-bounce 1s infinite alternate ease-in-out;
    }
    .waveform .bar:nth-child(1).anim { animation-delay: 0.1s; }
    .waveform .bar:nth-child(2).anim { animation-delay: 0.3s; }
    .waveform .bar:nth-child(3).anim { animation-delay: 0.2s; }
    .waveform .bar:nth-child(4).anim { animation-delay: 0.5s; }
    .waveform .bar:nth-child(5).anim { animation-delay: 0.4s; }
    .waveform .bar:nth-child(6).anim { animation-delay: 0.6s; }
    .waveform .bar:nth-child(7).anim { animation-delay: 0.3s; }
    .waveform .bar:nth-child(8).anim { animation-delay: 0.7s; }

    @keyframes wave-bounce {
      0% { height: 4px; }
      100% { height: 20px; }
    }

    /* Typing Bouncing Dots */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      padding: 4px 8px;
      margin-left: 32px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--text2);
      border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: -0s; }

    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Model Selector / Status Bar */
    .status-bar {
      min-height: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
      background: #111;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 4px;
    }
    .status-bar-left, .status-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      background: var(--surface);
      color: var(--text2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
    }
    .status-pill select {
      background: transparent;
      color: var(--text);
      border: none;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
      font-weight: 500;
    }
    .status-pill select option {
      background: var(--surface);
      color: var(--text);
    }
    .status-pill.status-model {
      color: var(--text);
      padding: 2px 6px;
    }
    .status-pill.status-approval {
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      color: var(--green);
      padding: 2px 6px;
    }
    .status-pill.status-approval select {
      background: transparent;
      color: var(--green);
      border: none;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
      font-weight: 500;
    }
    .status-pill.status-approval select option {
      background: #1a2a1a;
      color: var(--green);
    }

    /* Input Area */
    .input-area { padding: 12px 16px; flex-shrink: 0; }
    .input-container { display: flex; align-items: stretch; gap: 0; width: 100%; }
    .input-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none; display: flex; align-items: center; padding: 0 8px; }
    .input-box textarea { flex: 1; padding: 12px 8px; background: transparent; color: var(--text); border: none; resize: none; font-size: 14px; font-family: inherit; outline: none; min-height: 44px; max-height: 120px; line-height: 20px; }
    .input-box-btn { background: transparent; border: none; color: var(--text2); cursor: pointer; font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: background 0.1s, color 0.1s; flex-shrink: 0; }
    .input-box-btn:hover { background: var(--border); color: var(--text); }
    .send-btn-new { background: var(--accent); color: #ffffff; border: 1px solid var(--border); border-left: none; border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-top-left-radius: 0; border-bottom-left-radius: 0; width: 56px; min-width: 56px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
    .send-btn-new:hover { opacity: 0.9; }

    /* Right Panel */
    .right-panel { 
      grid-column: 4; 
      grid-row: 2; 
      background: var(--sidebar); 
      border-left: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    .panel-tabs { 
      display: flex; 
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      height: 48px;
      border-bottom: 1px solid var(--border); 
      flex-shrink: 0; 
    }
    .panel-header-btn {
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .panel-header-btn:hover {
      background: var(--surface);
      color: var(--text);
    }
    .panel-content { flex: 1; overflow-y: auto; padding: 16px; height: 100%; display: flex; flex-direction: column; }
    .preview-file { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text2); }

      .app.right-panel-collapsed {
        grid-template-columns: 48px var(--sidebar-width) 1fr 0px 48px;
      }
      .app.right-panel-collapsed .right-panel {
        display: none;
      }
      .app.sidebar-collapsed {
        grid-template-columns: 48px 0px 1fr 320px 48px;
      }
      .app.sidebar-collapsed.right-panel-collapsed {
        grid-template-columns: 48px 0px 1fr 0px 48px;
      }
      .app.sidebar-collapsed .sidebar {
        display: none;
      }
    }

    /* Mobile Overlay */
    .mobile-overlay { display: none; }

    /* Responsive styling rules */
    @media (max-width: 1023px) {
      .app { 
        grid-template-columns: 48px 260px 1fr; 
      }
      .right-strip { 
        display: none; 
      }

      }
    }

        width: 100vw;

        grid-row: 1;
      }
      .chat-area {
        grid-column: 1;
        grid-row: 2;
      }
      /* Hide icon strip from grid — it moves inside sidebar on mobile */
      .icon-strip {
        display: none;
      }
      /* Show mobile icon tabs inside sidebar */
      .mobile-sidebar-tabs {
        display: flex !important;
        flex-direction: row;
        gap: 0;
        border-bottom: 1px solid var(--border);
        padding: 0;
        flex-shrink: 0;
        overflow-x: auto;
        background: var(--icon-strip);

        width: 40px;
        height: 40px;

        background: none;

      .mobile-sidebar-tabs button.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        background: rgba(88, 166, 255, 0.06);
      }
      .sidebar { 
        position: fixed; 
        left: -100vw; 
        top: 0; 
        width: 85vw;
        max-width: 320px;
        height: 100vh; 
        z-index: 100; 
        transition: left 0.3s;
        flex-direction: column;
      }
      .sidebar.open { 
        left: 0; 
      }
      .right-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: -80vh;
        top: auto;
        width: 100%;
        height: 80vh;
        z-index: 100;

function icon(name, size, color) {
  var s = size || 20;
  var c = color || "currentColor";
  var entry = ICONS[name];
  if (!entry) return "?";
  
  if (iconMode === "emoji") return entry.emoji;
  
  var iconName = entry.nf;
  if (iconName === "custom:hyprcollab") {
    iconName = "mdi:rocket-launch-outline";
  }
  
  if (name === "connected" && !color) {
    c = "#3fb950";
  } else if (name === "disconnected" && !color) {
    c = "#f85149";
  }
  
  return '<span class="iconify" data-icon="' + iconName + '" data-width="' + s + '" data-height="' + s + '" style="color:' + c + '; vertical-align: middle; display: inline-block;"></span>';
}

function setIconMode(mode) {
  iconMode = mode;
  localStorage.setItem("hyprcollab-icon-mode", mode);
  refreshAllIcons();
}

function refreshAllIcons() {
  // Update icon strip buttons
  var stripMap = {
    "btn-chats": "chats", "btn-personas": "personas", "btn-skills": "skills",
    "btn-prompts": "prompts", "btn-memories": "memories", "btn-bookmarks": "bookmarks",
    "btn-files": "files", "btn-mcp": "mcp", "btn-settings": "settings"
  };
  Object.keys(stripMap).forEach(function(btnId) {
    var btn = document.getElementById(btnId);
    if (btn) btn.innerHTML = icon(stripMap[btnId], 18);
  });
  // Update mobile sidebar tabs
  document.querySelectorAll(".mobile-tab-btn").forEach(function(btn) {
    var tab = btn.getAttribute("data-tab");
    if (tab && ICONS[tab]) btn.innerHTML = icon(tab, 16);
  });
  // Re-render active panel + chat
  if (typeof activeSidebarTab !== "undefined") selectSidebarTab(activeSidebarTab);
  if (typeof renderMessages !== "undefined") renderMessages();
  if (typeof renderRightPanelContent !== "undefined") renderRightPanelContent();
  // Force Iconify to scan new DOM elements
  if (typeof Iconify !== "undefined") Iconify.scan();
}

// Toast notification helper
function showToast(message) {
  var container = document.getElementById("toast-container");
  if (!container) return;
  
  var toast = document.createElement("div");
  toast.style.background = "var(--surface)";
  toast.style.border = "1px solid var(--border)";
  toast.style.borderLeft = "4px solid var(--accent)";
  toast.style.color = "var(--text)";
  toast.style.padding = "8px 16px";
  toast.style.borderRadius = "6px";
  toast.style.fontSize = "13px";
  toast.style.boxShadow = "0 4px 12px rgba(0,0,0,0.5)";
  toast.style.opacity = "0";
  toast.style.transition = "opacity 0.2s, transform 0.2s";
  toast.style.transform = "translateY(10px)";
  toast.innerHTML = message;
  
  container.appendChild(toast);
  toast.offsetHeight; // trigger reflow
  
  toast.style.opacity = "1";
  toast.style.transform = "translateY(0)";
  
  setTimeout(function() {
    toast.style.opacity = "0";
    toast.style.transform = "translateY(-10px)";
    setTimeout(function() {
      toast.remove();
    }, 200);
  }, 2500);
}

      overlay.classList.add("active");

  updateRightButtonsUI();
  renderRightPanelContent();

function toggleRightPanel() {
  var app = document.querySelector(".app");
  var panel = document.querySelector(".right-panel");
  var overlay = document.getElementById("overlay");
  
  var isOpen = false;
  if (window.innerWidth >= 1024) {
    isOpen = !app.classList.contains("right-panel-collapsed");
  } else {
    isOpen = panel.classList.contains("open");
  }
  
  if (isOpen) {
    activeRightTab = null;
    if (window.innerWidth >= 1024) {
      app.classList.add("right-panel-collapsed");
    } else {
      panel.classList.remove("open");
      overlay.classList.remove("active");
    }
  } else {
    activeRightTab = lastActiveRightTab || "info";
    if (window.innerWidth >= 1024) {
      app.classList.remove("right-panel-collapsed");
    } else {
      panel.classList.add("open");
      overlay.classList.add("active");
    }
  }
  updateRightButtonsUI();
  renderRightPanelContent();
}

  activeRightTab = null;
  var app = document.querySelector(".app");
  var panel = document.querySelector(".right-panel");
  var overlay = document.getElementById("overlay");

// Render left chats list
function renderChatList() {
  var list = document.getElementById("chatList");
  if (!list) return;
  list.innerHTML = "";
  
  var searchInput = document.getElementById("searchInput");
  var filter = searchInput ? searchInput.value.toLowerCase() : "";
  
  var projectFilter = document.getElementById("projectFilter");
  var projectVal = projectFilter ? projectFilter.value : "all";
  
  var groups = { pinned: "Pinned", today: "Today", yesterday: "Yesterday", older: "Previous 7 Days" };
  var ordered = ["pinned", "today", "yesterday", "older"];
  
  ordered.forEach(function(sec) {
    var items = chats.filter(function(c) {
      if (c.section !== sec) return false;
      if (projectVal !== "all" && c.project !== projectVal) return false;
      if (filter) {
        var matchesTitle = c.title.toLowerCase().indexOf(filter) >= 0;
        var matchesName = c.name.toLowerCase().indexOf(filter) >= 0;
        var matchesProject = c.project.toLowerCase().indexOf(filter) >= 0;
        if (!matchesTitle && !matchesName && !matchesProject) return false;
      }
      return true;
    });
    if (!items.length) return;
    
    var label = document.createElement("div");
    label.className = "chat-group-label";
    label.textContent = groups[sec];
    list.appendChild(label);
    
    items.forEach(function(c) {
      var div = document.createElement("div");
      div.className = "chat-item" + (c.id === currentChat ? " active" : "");
      var pinIcon = c.section === "pinned" ? icon("pin") + " " : "";
      div.innerHTML = "<div class=\"chat-item-line1\"><span class=\"chat-item-name\">" + pinIcon + c.emoji + " " + c.name + "</span><span class=\"chat-item-time\">" + c.time + "</span></div>" +
                      "<div class=\"chat-item-title\">" + c.title + "</div>" +
                      "<div class=\"chat-item-project\">" + icon("folder") + " " + c.project + "</div>";
      div.onclick = function() { selectChat(c.id); };
      div.oncontextmenu = function(e) { e.preventDefault(); showChatContextMenu(e, c); };
      list.appendChild(div);
    });
  });
}

// ── Chat Context Menu ──
function showChatContextMenu(e, chat) {
  var existing = document.getElementById("chatCtxMenu");
  if (existing) existing.remove();

  var isPinned = chat.section === "pinned";
  var menu = document.createElement("div");
  menu.id = "chatCtxMenu";
  menu.style.cssText = "position:fixed; z-index:9999; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; min-width:160px; box-shadow:0 8px 24px rgba(0,0,0,0.5); font-size:12px;";
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";

  var items = [
    { icon: isPinned ? icon("pin") : icon("pin"), label: isPinned ? "Unpin chat" : "Pin chat", action: function() { togglePinChat(chat); } },
    { icon: icon("edit"), label: "Rename", action: function() { renameChat(chat); } },
    { icon: icon("duplicate"), label: "Duplicate", action: function() { duplicateChat(chat); } },
    { icon: icon("export"), label: "Export", action: function() { showToast(icon("export") + " Chat exported!"); } },
    { sep: true },
    { icon: icon("delete"), label: "Delete", danger: true, action: function() { deleteChat(chat); } },
  ];

  items.forEach(function(item) {
    if (item.sep) {
      var sep = document.createElement("div");
      sep.style.cssText = "height:1px; background:var(--border); margin:4px 0;";
      menu.appendChild(sep);
      return;
    }
    var btn = document.createElement("div");
    btn.style.cssText = "padding:7px 10px; border-radius:4px; cursor:pointer; display:flex; align-items:center; gap:8px; color:" + (item.danger ? "#f85149" : "var(--text)") + ";";
    btn.innerHTML = "<span>" + item.icon + "</span><span>" + item.label + "</span>";
    btn.onmouseenter = function() { btn.style.background = item.danger ? "rgba(248,81,73,0.1)" : "rgba(255,255,255,0.05)"; };
    btn.onmouseleave = function() { btn.style.background = "transparent"; };
    btn.onclick = function() { document.getElementById("chatCtxMenu").remove(); item.action(); };
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);

  // Close on click outside
  setTimeout(function() {
    document.addEventListener("click", function handler() {
      var m = document.getElementById("chatCtxMenu");
      if (m) m.remove();
      document.removeEventListener("click", handler);
    });
  }, 10);
}

function togglePinChat(chat) {
  if (chat.section === "pinned") {
    chat.section = "today";
    showToast(icon("pin") + " Chat unpinned");
  } else {
    chat.section = "pinned";
    showToast(icon("pin") + " Chat pinned!");
  }
  renderChatList();
}

function renameChat(chat) {
  var newName = prompt("Rename chat:", chat.name);
  if (newName && newName.trim()) {
    chat.name = newName.trim();
    renderChatList();
    showToast(icon("edit") + " Chat renamed to " + chat.name);
  }
}

function deleteChat(chat) {
  if (!confirm("Delete chat with " + chat.name + "?")) return;
  chats = chats.filter(function(c) { return c.id !== chat.id; });
  if (currentChat === chat.id) {
    currentChat = chats.length > 0 ? chats[0].id : null;
    renderMessages();
  }
  renderChatList();
  showToast(icon("delete") + " Chat deleted");
}

function duplicateChat(chat) {
  var dup = Object.assign({}, chat);
  dup.id = "c" + Date.now();
  dup.name = chat.name + " (copy)";
  dup.section = "today";
  dup.time = new Date().toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", hour12:false});
  chats.push(dup);
  renderChatList();
  showToast(icon("duplicate") + " Chat duplicated");
}

  document.getElementById("headerAvatar").textContent = c.emoji;
  document.getElementById("headerAvatar").style.background = c.color;
  document.getElementById("headerName").textContent = c.name;
  document.getElementById("headerMeta").textContent = c.agent;

  var modelSelect = document.getElementById("modelSelect");

    var prov = modelToProvider[c.model] || "OpenAI";

    var models = providerModels[prov] || ["Local Model"];
    modelSelect.innerHTML = "";
    models.forEach(function(m) {
      var opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m + " ▼";
      modelSelect.appendChild(opt);
    });
    modelSelect.value = c.model;
  }
  
  var contextWindowText = document.getElementById("contextWindowText");
  var contextProgressBar = document.getElementById("contextProgressBar");
  if (contextWindowText && contextProgressBar) {

    contextWindowText.textContent = kVal + "/128K";
    var pct = Math.min(100, (tokenVal / 128000) * 100);
    contextProgressBar.style.width = pct + "%";
  }
  
  updateActiveToolsCount();
  
  var statusPersona = document.getElementById("statusPersona");
  if (statusPersona) {

  }
  
  var area = document.getElementById("messages");

  c.messages.forEach(function(m, mIdx) {
    var div = document.createElement("div");
    div.className = "msg " + (m.from === "user" ? "user" : "bot");
    
    // Check if message is currently editing inline

      var bubbleHtml = "<div class=\"edit-area\" style=\"display:flex; flex-direction:column; gap:8px; min-width:260px;\">" +

                       "  <div style=\"display:flex; justify-content:flex-end; gap:6px;\">" +
                       "    <button class=\"btn btn-ghost\" style=\"padding:4px 8px; font-size:12px;\" onclick=\"cancelEdit('" + c.id + "', " + mIdx + ")\">Cancel</button>" +
                       "    <button class=\"btn\" style=\"background:var(--accent); color:#000; padding:4px 8px; font-size:12px;\" onclick=\"saveEdit('" + c.id + "', " + mIdx + ", document.getElementById('" + textareaId + "').value)\">Save</button>" +
                       "  </div>" +
                       "</div>";
      if (m.from === "user") {

// Inline edit handlers
function enableInlineEdit(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  chat.messages[msgIdx].isEditing = true;
  renderMessages();
}

function cancelEdit(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  chat.messages[msgIdx].isEditing = false;
  renderMessages();
}

function saveEdit(chatId, msgIdx, newText) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  msg.text = newText;
  
  if (msg.siblings && msg.siblings.length > 0) {
    var actIdx = msg.activeSiblingIndex || 0;
    msg.siblings[actIdx] = newText;
  }
  
  msg.isEditing = false;
  renderMessages();
  showToast("Message updated!");
}

// Sibling Switching
function prevSibling(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  if (msg.siblings && msg.siblings.length > 1) {
    msg.activeSiblingIndex = (msg.activeSiblingIndex - 1 + msg.siblings.length) % msg.siblings.length;
    msg.text = msg.siblings[msg.activeSiblingIndex];
    renderMessages();
  }
}

function nextSibling(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  if (msg.siblings && msg.siblings.length > 1) {
    msg.activeSiblingIndex = (msg.activeSiblingIndex + 1) % msg.siblings.length;
    msg.text = msg.siblings[msg.activeSiblingIndex];
    renderMessages();
  }
}

// Regenerate message sequence
function regenerateMessage(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  
  msg.isLoading = true;
  renderMessages();
  
  setTimeout(function() {
    msg.isLoading = false;
    if (msg.siblings && msg.siblings.length > 1) {
      msg.activeSiblingIndex = (msg.activeSiblingIndex + 1) % msg.siblings.length;
      msg.text = msg.siblings[msg.activeSiblingIndex];
    }
    renderMessages();
    showToast("Response regenerated!");
  }, 1000);
}

// Continue generating mock details
function continueMessage(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  
  var textToAppend = "... continuing with supplementary details and system metrics.";
  var charIdx = 0;
  
  isStreaming = true;
  document.getElementById("stop-streaming-container").style.display = "flex";
  
  function streamAppend() {
    if (!isStreaming) return;
    if (charIdx < textToAppend.length) {
      msg.text += textToAppend[charIdx];
      charIdx++;
      renderMessages();
      var t = setTimeout(streamAppend, 20);
      streamingTimeouts.push(t);
    } else {
      isStreaming = false;
      document.getElementById("stop-streaming-container").style.display = "none";
      renderMessages();
    }
  }
  streamAppend();
}

// TTS playback control
function toggleTtsPlayer(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  msg.showTts = !msg.showTts;
  msg.isPlayingTts = false;
  renderMessages();
}

function togglePlayTts(chatId, msgIdx) {
  var chat = chats.find(function(c) { return c.id === chatId; });
  if (!chat) return;
  var msg = chat.messages[msgIdx];
  msg.isPlayingTts = !msg.isPlayingTts;
  renderMessages();
}

// Extract XML/Mermaid/HTML blocks dynamically from messages for the Artifacts panel
function getArtifactsFromChat(chat) {
  var list = [];
  chat.messages.forEach(function(msg, msgIdx) {
    var text = msg.text;
    var searchStr = "class=\"code-block\"";
    var pos = 0;
    while (true) {
      var idx = text.indexOf(searchStr, pos);
      if (idx === -1) break;
      
      var headerStart = text.indexOf("<div class=\"code-block-header\">", idx);
      var spanStart = text.indexOf("<span>", headerStart);
      var spanEnd = text.indexOf("</span>", spanStart);
      if (spanStart === -1 || spanEnd === -1) {
        pos = idx + searchStr.length;
        continue;
      }
      var lang = text.substring(spanStart + 6, spanEnd).trim().toLowerCase();
      
      var preStart = text.indexOf("<pre>", spanEnd);
      var preEnd = text.indexOf("</pre>", preStart);
      if (preStart === -1 || preEnd === -1) {
        pos = idx + searchStr.length;
        continue;
      }
      var rawCode = text.substring(preStart + 5, preEnd);
      
      var decodedCode = rawCode.replace(/&lt;/g, "<")
                               .replace(/&gt;/g, ">")
                               .replace(/&amp;/g, "&")
                               .replace(/&quot;/g, "\"")
                               .replace(/&#39;/g, "'");
      
      list.push({
        msgIdx: msgIdx,
        lang: lang,
        code: decodedCode
      });
      
      pos = preEnd + 6;
    }
  });
  return list;
}

function copyActivePreviewCode() {
  var c = chats.find(function(x){return x.id === currentChat;});
  if (c && c.previewCode) {
    navigator.clipboard.writeText(c.previewCode.join("\n"));
    showToast("Preview code copied!");
  }
}

function downloadActivePreviewCode() {
  var c = chats.find(function(x){return x.id === currentChat;});
  if (c && c.previewCode) {
    var blob = new Blob([c.previewCode.join("\n")], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = c.previewFile.split("/").pop();
    a.click();
    URL.revokeObjectURL(url);
    showToast("File download initiated!");
  }
}

function copyArtifactCode(idx) {
  var code = window.artifactsCache[idx].code;
  navigator.clipboard.writeText(code);
  showToast("Artifact code copied to clipboard!");
}

function copyFullscreenArtifact() {
  if (currentArtifactCode) {
    navigator.clipboard.writeText(currentArtifactCode);
    showToast("Fullscreen artifact code copied!");
  }
}

// Dynamic Mermaid & HTML preview loading
function renderMermaidArtifact(code, container) {
  container.innerHTML = "<div style=\"color:var(--text2); font-size:12px; padding:16px;\">Rendering flowchart...</div>";
  if (typeof mermaid === "undefined") {
    container.innerHTML = "<div style=\"color:var(--red); font-size:12px; padding:16px;\">Mermaid CDN library not found.</div>";
    return;
  }
  try {
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
    var uniqueId = "mermaid-" + Math.floor(Math.random() * 1000000);
    mermaid.render(uniqueId, code).then(function(res) {
      container.innerHTML = "<div style=\"padding:16px; overflow:auto; display:flex; justify-content:center; align-items:center; background:#111; border-radius:8px; border:1px solid var(--border); height:100%;\">" + res.svg + "</div>";
    }).catch(function(err) {
      container.innerHTML = "<div style=\"color:var(--red); padding:16px; font-size:12px;\">Mermaid rendering error: " + err.message + "</div>";
    });
  } catch (e) {
    container.innerHTML = "<div style=\"color:var(--red); padding:16px; font-size:12px;\">Error: " + e.message + "</div>";
  }
}

function renderHtmlArtifact(code, container) {
  var iframe = document.createElement("iframe");
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.style.background = "#111";
  iframe.style.borderRadius = "8px";
  iframe.sandbox = "allow-scripts";
  container.innerHTML = "";
  container.appendChild(iframe);
  
  var doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(code);
  doc.close();
}

function openArtifactContent(code, type) {
  currentArtifactCode = code;
  currentArtifactType = type;
  
  activeRightTab = "artifact";
  
  var app = document.querySelector(".app");
  var panel = document.querySelector(".right-panel");
  var overlay = document.getElementById("overlay");
  
  if (window.innerWidth >= 1024) {
    app.classList.remove("right-panel-collapsed");
  } else {
    panel.classList.add("open");
    overlay.classList.add("active");
  }
  
  updateRightButtonsUI();
  renderRightPanelContent();
}

function updateStatusBar(c) {
  var latencyPill = document.getElementById("latencyPill");
  var chatSizePill = document.getElementById("chatSizePill");
  var memoryPill = document.getElementById("memoryPill");
  var latency = Math.floor(200 + Math.random() * 400);
  if (latencyPill) latencyPill.innerHTML = icon("bolt") + " " + latency + "ms";
  var msgCount = c ? c.messages.length : 0;
  var sizeKB = (msgCount * 0.52).toFixed(1);
  if (chatSizePill) chatSizePill.innerHTML = icon("chats") + " " + msgCount + "·" + sizeKB + "KB";
  var memKB = (12.8 + msgCount * 0.3 + Math.random() * 2).toFixed(1);
  if (memoryPill) memoryPill.innerHTML = icon("memories") + " " + memKB + "KB";
}

function changeModel() {
  var select = document.getElementById("modelSelect");
  var c = chats.find(function(x){return x.id === currentChat;});
  if (c) {
    c.model = select.value;
    renderMessages();
    renderRightPanelContent();
  }
}

function handleMessageKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    if (appSettings.sendOnEnter) {
      event.preventDefault();
      sendMessage();
    }
  }
}

// Bouncing dots streaming sequence trigger
function sendMessage() {
  if (isStreaming) return;
  var input = document.getElementById("msgInput");
  var text = input.value.trim();
  if (!text) return;
  input.value = "";
  
  var c = chats.find(function(x){return x.id === currentChat;});
  if (!c) return;
  
  c.messages.push({
    from: "user",
    text: text,
    time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  });
  renderMessages();
  
  isStreaming = true;
  document.getElementById("stop-streaming-container").style.display = "flex";
  
  var botMsgIndex = c.messages.length;
  var botMsgTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  
  var fullText = mockBotResponses[botMsgIndex % mockBotResponses.length];
  
  var botMsg = {
    from: "bot",
    text: "",
    time: botMsgTime,
    siblings: [
      fullText,
      "Alternative Version 2:\nThis is a secondary fallback variant response verifying token boundaries.",
      "Alternative Version 3:\nThis is a tertiary response focusing on performance improvements."
    ],
    activeSiblingIndex: 0,
    isStreamingPlaceholder: true,
    showTypingDot: true
  };
  c.messages.push(botMsg);
  renderMessages();
  
  var t1 = setTimeout(function() {
    botMsg.showTypingDot = false;
    botMsg.tool = {
      name: "read_file",
      args: "src/main.rs",
      status: "RUNNING",
      time: "...",
      output: ""
    };
    renderMessages();
    
    var t2 = setTimeout(function() {
      botMsg.tool.status = "OK";
      botMsg.tool.time = "0.3s";
      botMsg.tool.output = "// File src/main.rs read successfully\nfn main() {\n  println!(\"Hello, world!\");\n}";
      renderMessages();
      
      var charIdx = 0;
      function streamChar() {
        if (!isStreaming) return;
        if (charIdx < fullText.length) {
          if (fullText[charIdx] === "<") {
            var tagEnd = fullText.indexOf(">", charIdx);
            if (tagEnd !== -1) {
              botMsg.text += fullText.substring(charIdx, tagEnd + 1);
              charIdx = tagEnd + 1;
            } else {
              botMsg.text += fullText[charIdx];
              charIdx++;
            }
          } else {
            botMsg.text += fullText[charIdx];
            charIdx++;
          }
          renderMessages();
          
          var tStream = setTimeout(streamChar, 15);
          streamingTimeouts.push(tStream);
        } else {
          isStreaming = false;
          botMsg.isStreamingPlaceholder = false;
          document.getElementById("stop-streaming-container").style.display = "none";
          updateStatusBar(c);
          renderMessages();
        }
      }
      
      var tStream = setTimeout(streamChar, 15);
      streamingTimeouts.push(tStream);
      
    }, 500);
    streamingTimeouts.push(t2);
    
  }, 1000);
  streamingTimeouts.push(t1);
}

function stopStreaming() {
  if (!isStreaming) return;
  isStreaming = false;
  
  streamingTimeouts.forEach(clearTimeout);
  streamingTimeouts = [];
  
  document.getElementById("stop-streaming-container").style.display = "none";
  showToast("Generation stopped.");
  
  var c = chats.find(function(x){return x.id === currentChat;});
  if (c && c.messages.length > 0) {
    var last = c.messages[c.messages.length - 1];
    if (last.from === "bot" && last.isStreamingPlaceholder) {
      last.isStreamingPlaceholder = false;
      last.showTypingDot = false;
      if (last.tool && last.tool.status === "RUNNING") {
        last.tool.status = "STOPPED";
        last.tool.time = "N/A";
      }
      renderMessages();
    }
  }
}

// Full page advanced search overlay functions
function openSearchOverlay() {
  document.getElementById("search-overlay").style.display = "flex";
  var input = document.getElementById("overlaySearchInput");
  input.value = "";
  input.focus();
  document.getElementById("overlaySearchResults").innerHTML = "<div style=\"color: var(--text2); font-size: 13px; text-align: center; margin-top: 24px;\">Type query phrase above.</div>";
}

function closeSearchOverlay() {
  document.getElementById("search-overlay").style.display = "none";
}

function performOverlaySearch() {
  var input = document.getElementById("overlaySearchInput");
  var query = input.value.toLowerCase().trim();
  var resultsContainer = document.getElementById("overlaySearchResults");
  
  if (!query) {
    resultsContainer.innerHTML = "<div style=\"color: var(--text2); font-size: 13px; text-align: center; margin-top: 24px;\">Type query phrase above.</div>";
    return;
  }
  
  var results = [];
  chats.forEach(function(c) {
    c.messages.forEach(function(m) {
      var textToSearch = [m.text];
      if (m.siblings) {
        m.siblings.forEach(function(s) {
          if (textToSearch.indexOf(s) === -1) textToSearch.push(s);
        });
      }
      
      textToSearch.forEach(function(txt) {
        var idx = txt.toLowerCase().indexOf(query);
        if (idx !== -1) {
          var start = Math.max(0, idx - 40);
          var end = Math.min(txt.length, idx + query.length + 40);
          var snippet = txt.substring(start, end);
          if (start > 0) snippet = "..." + snippet;
          if (end < txt.length) snippet = snippet + "...";
          
          var regex = new RegExp("(" + query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + ")", "gi");
          var highlighted = snippet.replace(regex, "<span style=\"color:var(--accent); font-weight:600; background:rgba(88,166,255,0.15); padding:0 2px; border-radius:2px;\">$1</span>");
          
          results.push({
            chatId: c.id,
            chatName: c.name,
            chatEmoji: c.emoji,
            time: m.time,
            text: highlighted
          });
        }
      });
    });
  });
  
  resultsContainer.innerHTML = "";
  if (results.length === 0) {
    resultsContainer.innerHTML = "<div style=\"color: var(--text2); font-size: 13px; text-align: center; margin-top: 24px;\">No matching messages found.</div>";
    return;
  }
  
  results.forEach(function(r) {
    var div = document.createElement("div");
    div.style.background = "var(--surface)";
    div.style.border = "1px solid var(--border)";
    div.style.borderRadius = "8px";
    div.style.padding = "12px";
    div.style.cursor = "pointer";
    div.style.transition = "border-color 0.15s, transform 0.15s";
    
    div.onmouseenter = function() {
      div.style.borderColor = "var(--accent)";
    };
    div.onmouseleave = function() {
      div.style.borderColor = "var(--border)";
    };
    
    div.onclick = function() {
      selectChat(r.chatId);
      closeSearchOverlay();
    };
    
    var header = document.createElement("div");
    header.style.display = "flex";
    header.style.justifyContent = "space-between";
    header.style.fontSize = "12px";
    header.style.color = "var(--text2)";
    header.style.marginBottom = "6px";
    header.innerHTML = "<span style=\"font-weight:600; color:var(--text);\">" + r.chatEmoji + " " + r.chatName + "</span><span>" + r.time + "</span>";
    
    var body = document.createElement("div");
    body.style.fontSize = "13px";
    body.style.color = "var(--text)";
    body.innerHTML = r.text;
    
    div.appendChild(header);
    div.appendChild(body);
    resultsContainer.appendChild(div);
  });
}

function savePersona(editId) {
  var name = document.getElementById("pers-name").value.trim();
  if (!name) {
    showToast("Please enter a name");
    return;
  }
  var tone = document.getElementById("pers-tone").value;
  var style = document.getElementById("pers-style").value;
  var lang = document.getElementById("pers-lang").value;
  var personality = document.getElementById("pers-personality").value;
  var role = document.getElementById("pers-role").value;
  var model = document.getElementById("pers-model").value;
  
  if (editId) {
    var p = personasData.find(function(x) { return x.id === editId; });
    if (p) {
      p.name = name;
      p.emoji = currentPersonaEmoji;
      p.tone = tone;
      p.style = style;
      p.language = lang;
      p.personality = personality;
      p.agentRole = role;
      p.model = model;
      p.desc = "";
      
      if (p.active) {
        updateHeaderAndStatusForActivePersona(p);
      }
      showToast("Persona updated!");
    }
  } else {
    var newId = "p_" + Date.now();
    var newPersona = {
      id: newId,
      name: name,
      emoji: currentPersonaEmoji,
      tone: tone,
      style: style,
      language: lang,
      personality: personality,
      agentRole: role,
      model: model,
      active: false
    };
    personasData.push(newPersona);
    showToast("Persona created!");
  }
  
  cancelPersonaForm();
}

  event.stopPropagation();
  var p = personasData.find(function(x) { return x.id === id; });
  if (!p) return;
  
  var action = prompt("Persona Actions for " + p.name + ":\\n- Enter 'delete' to delete persona\\n- Enter 'duplicate' to duplicate\\n- Enter 'status' to toggle Active/Inactive", "");
  if (!action) return;
  
  action = action.toLowerCase().trim();
  if (action === "delete") {
    if (p.active) {
      showToast("Cannot delete active persona!");
      return;
    }
    personasData = personasData.filter(function(x) { return x.id !== id; });
    showToast("Persona deleted!");
    cancelPersonaForm();
  } else if (action === "duplicate") {
    var dup = {
      id: "p_" + Date.now(),
      name: p.name + " Copy",
      emoji: p.emoji,
      tone: p.tone,
      style: p.style,
      language: p.language,
      personality: p.personality,
      agentRole: p.agentRole,
      model: p.model,
      active: false
    };
    personasData.push(dup);
    showToast("Persona duplicated!");
    cancelPersonaForm();
  } else if (action === "status") {
    setActivePersona(id);
  }
}

    btn.classList.add("active");

}

function changeIconMode(val) {
  iconMode = val;
  localStorage.setItem("hyprcollab-icon-mode", val);
  var c = chats.find(function(x){return x.id === currentChat;});
  updateStaticIcons();
  selectSidebarTab(activeSidebarTab);
  renderMessages();
  renderRightPanelContent();
  updateStatusBar(c);
}

function saveSettings() {
  applyStyleSettings();
  syncSettingsToStatusBar();
  showToast(icon("settings") + " Settings saved!");
}

function resetSettings() {
  appSettings = { theme:"dark", accent:"#58a6ff", language:"en", fontSize:14, sendOnEnter:true, showTimestamps:true, showAvatars:true, compactMode:false, provider:"openai", model:"gpt-4o", temperature:0.7, maxTokens:4096, streamResponse:true, contextWindow:"128k", autoSave:true, approvalMode:"suggest", telemetry:false, cacheResponses:true, sidebarWidth:260 };
  iconMode = "emoji";
  localStorage.setItem("hyprcollab-icon-mode", "emoji");
  applyStyleSettings();
  syncSettingsToStatusBar();
  var c = chats.find(function(x){return x.id === currentChat;});
  updateStaticIcons();
  selectSidebarTab(activeSidebarTab);
  renderMessages();
  renderRightPanelContent();
  updateStatusBar(c);
  showToast(icon("reset") + " Settings reset to defaults");
}

function updateModelOptions() {
  var models = {
    openai: ["gpt-4o","GPT-4o","gpt-4o-mini","GPT-4o Mini","o1","o1","o3-mini","o3-mini"],
    anthropic: ["claude-3-5-sonnet","Claude 3.5 Sonnet","claude-3-opus","Claude 3 Opus","claude-3-haiku","Claude 3 Haiku"],
    google: ["gemini-1.5-pro","Gemini 1.5 Pro","gemini-1.5-flash","Gemini 1.5 Flash"],
    xai: ["grok-2","Grok 2","grok-1.5","Grok 1.5"],
    deepseek: ["deepseek-v3","DeepSeek V3","deepseek-coder","DeepSeek Coder"],
    ollama: ["llama-3","Llama 3","mistral","Mistral","phi-3","Phi 3"],
    native: ["local-model","Local Model"]
  };
  var sel = document.getElementById("s-model");
  if (!sel) return;
  var providerVal = appSettings.provider;
  var m = models[providerVal] || ["local-model", "Local Model"];
  var html = "";
  for (var i = 0; i < m.length; i += 2) {
    var isSel = (appSettings.model === m[i]) ? " selected" : "";
    html += "<option value=\"" + m[i] + "\"" + isSel + ">" + m[i+1] + "</option>";
  }
  sel.innerHTML = html;
  
  var hasModel = false;
  for (var i = 0; i < m.length; i += 2) {
    if (m[i] === appSettings.model) {
      hasModel = true;
      break;
    }
  }
  if (!hasModel) {
    appSettings.model = m[0];
    sel.value = m[0];
  }
}

function syncSettingsToStatusBar() {
  var providerSelect = document.getElementById("providerSelect");
  if (providerSelect) {
    var pMap = {
      openai: "OpenAI",
      anthropic: "Anthropic",
      google: "Google",
      xai: "xAI",
      deepseek: "DeepSeek",
      ollama: "Ollama",
      native: "Local"
    };
    var provStr = pMap[appSettings.provider] || "OpenAI";
    providerSelect.value = provStr;
    updateProviderModels();
  }
  
  var modelSelect = document.getElementById("modelSelect");
  if (modelSelect) {
    var mKeys = {
      "gpt-4o": "GPT-4o",
      "gpt-4o-mini": "GPT-4o-turbo",
      "claude-3-5-sonnet": "Claude 3.5 Sonnet",
      "gemini-1.5-pro": "Gemini 1.5 Pro",
      "gemini-1.5-flash": "Gemini 1.5 Flash",
      "grok-2": "Grok 2",
      "deepseek-v3": "DeepSeek V3",
      "llama-3": "Llama 3",
      "local-model": "Local Model"
    };
    var matchedModel = mKeys[appSettings.model] || appSettings.model;
    var options = modelSelect.options;
    var found = false;
    for (var i = 0; i < options.length; i++) {
      if (options[i].value === matchedModel) {
        modelSelect.value = matchedModel;
        found = true;
        break;
      }
    }
    if (!found && options.length > 0) {
      modelSelect.value = options[0].value;
    }
  }
  
  var approvalSelect = document.getElementById("approvalSelect");
  if (approvalSelect) {
    approvalSelect.value = appSettings.approvalMode;
  }
  
  var pills = document.querySelectorAll(".status-pill");
  pills.forEach(function(p) {
    if (p.id === "statusTemp") {
      p.innerHTML = icon("thermometer") + " " + appSettings.temperature.toFixed(1);
    }
  });
  var ctxEl = document.getElementById("contextWindowText");
  if (ctxEl) {
    var ctxVal = appSettings.contextWindow.toUpperCase();
    ctxEl.textContent = "12.4K/" + ctxVal;
  }
}

function openPanelSettings(panelName) {
  var settings = panelSettingsMap[panelName];
  if (!settings) { showToast("No settings for " + panelName); return; }
  var body = document.getElementById("sidebarBody");
  var html = "<div style=\"padding:8px; overflow-y:auto; height:100%; display:flex; flex-direction:column; gap:0;\">";
  html += "<button onclick=\"selectSidebarTab('" + panelName + "')\" style=\"background:none; border:none; color:var(--accent); font-size:12px; cursor:pointer; text-align:left; padding:4px 0; margin-bottom:4px; font-family:inherit;\">" + icon("back") + " Back to " + panelName.charAt(0).toUpperCase() + panelName.slice(1) + "</button>";
  html += settingsSection(icon("settings") + " " + panelName.charAt(0).toUpperCase() + panelName.slice(1) + " Settings");
  settings.forEach(function(s) {
    var label = s[0], type = s[1];
    if (type === "toggle") {
      html += settingsRow(label, toggleHtml("panel_" + panelName + "_" + label.replace(/\s/g,"_"), s[2]));
    } else if (type === "select") {
      var opts = s[2].map(function(o) { return "<option value=\"" + o[0] + "\"" + (o[0]===s[3]?" selected":"") + ">" + o[1] + "</option>"; }).join("");
      html += settingsRow(label, "<select onchange=\"showToast('Setting updated')\" class=\"setting-select\">" + opts + "</select>");
    }
  });
  html += "</div>";
  body.innerHTML = html;
}
